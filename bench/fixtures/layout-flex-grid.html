<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Koko layout flex and grid fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; font-size: 16px; }
    #flex { display: flex; width: 600px; height: 120px; gap: 10px; padding: 10px; border: 2px solid #102030; align-items: stretch; }
    #flex > .item { flex: 1 1 0; min-width: 0; padding: 8px; border: 1px solid #304050; }
    #flex > .wide { flex: 2 1 0; }
    #grid { display: grid; width: 640px; grid-template-columns: 100px 1fr 2fr; grid-template-rows: 40px 60px; gap: 8px; margin-top: 16px; padding: 8px; border: 2px solid #203040; }
    #grid > .cell { padding: 4px; border: 1px solid #405060; }
  </style>
</head>
<body>
  <section id="flex" aria-label="flex fixture">
    <div class="item">alpha</div><div class="item wide">bravo</div><div class="item">charlie</div>
  </section>
  <section id="grid" aria-label="grid fixture">
    <div class="cell">one</div><div class="cell">two</div><div class="cell">three</div>
    <div class="cell">four</div><div class="cell">five</div><div class="cell">six</div>
  </section>
</body>
</html>
