<!doctype html><meta charset="utf-8"><script src="../_shared/runtime-invariants.js"></script><script>
addEventListener("DOMContentLoaded", () => {
    const inv = RuntimeInvariant;
    const iframe = document.createElement("iframe");
    iframe.src = "about:blank";
    document.body.appendChild(iframe);
    const stale = iframe.contentWindow;
    inv.checkRealm("before-detach", stale);
    iframe.remove();
    inv.log(iframe.contentWindow === null ? "element-contentWindow:null" : "element-contentWindow:present");
    try {
        inv.log(typeof stale.Object.prototype.toString.call(stale.navigator) === "string" ? "stale-ref:safe-object-toString" : "stale-ref:bad-object-toString");
    } catch (err) {
        inv.log("stale-ref:error:" + err.name);
    }
    Promise.resolve().then(() => inv.done());
});
</script><body></body>
