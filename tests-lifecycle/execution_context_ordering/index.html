<!doctype html><meta charset="utf-8"><script src="../_shared/runtime-invariants.js"></script><script>
addEventListener("DOMContentLoaded", () => {
    const inv = RuntimeInvariant;
    inv.event("domcontentloaded");
    inv.checkRealm("root", window);
    const iframe = document.createElement("iframe");
    iframe.src = "about:blank";
    document.body.appendChild(iframe);
    inv.checkRealm("iframe-about-blank", iframe.contentWindow);
    Promise.resolve().then(() => {
        inv.event("microtask-after-iframe");
        inv.checkRealm("iframe-microtask", iframe.contentWindow);
        inv.done();
    });
});
</script><body></body>
