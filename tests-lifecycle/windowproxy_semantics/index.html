<!doctype html><meta charset="utf-8"><script src="../_shared/runtime-invariants.js"></script><script>
addEventListener("DOMContentLoaded", () => {
    const inv = RuntimeInvariant;
    const iframe = document.createElement("iframe");
    iframe.src = "about:blank";
    document.body.appendChild(iframe);
    const w1 = iframe.contentWindow;
    inv.checkRealm("initial", w1);
    iframe.src = "about:blank";
    Promise.resolve().then(() => {
        const w2 = iframe.contentWindow;
        inv.checkRealm("after-nav", w2);
        inv.log(w1 === w2 ? "windowproxy:stable-identity" : "windowproxy:replaced-identity");
        iframe.remove();
        inv.log(iframe.contentWindow === null ? "detached:null" : "detached:present");
        inv.done();
    });
});
</script><body></body>
