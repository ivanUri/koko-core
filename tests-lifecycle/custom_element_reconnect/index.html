<!doctype html><meta charset="utf-8"><title>custom_element_reconnect</title><div id="host"></div>
<script>
window.TEST_LOGS = [];
window.TEST_RESULT = { done: false, scenario: "custom_element_reconnect" };
class ProbeElement extends HTMLElement {
  connectedCallback() { window.TEST_LOGS.push("connected"); }
  disconnectedCallback() { window.TEST_LOGS.push("disconnected"); }
}
customElements.define("probe-element", ProbeElement);
const host = document.getElementById("host");
const el = document.createElement("probe-element");
host.appendChild(el);
host.removeChild(el);
host.appendChild(el);
setTimeout(() => {
  window.TEST_LOGS.push("stable");
  window.TEST_RESULT.done = true;
}, 0);
</script>
