<!doctype html><meta charset="utf-8"><script src="../_shared/runtime-invariants.js"></script><script>
addEventListener("DOMContentLoaded", () => {
    const inv = RuntimeInvariant;
    const iframe = document.createElement("iframe");
    inv.log(iframe.contentWindow === null ? "before-attach:null" : "before-attach:present");
    iframe.src = "about:blank";
    document.body.appendChild(iframe);
    inv.checkRealm("after-append", iframe.contentWindow);
    Promise.resolve().then(() => {
        inv.checkRealm("microtask", iframe.contentWindow);
        iframe.remove();
        inv.log(iframe.contentWindow === null ? "after-remove:null" : "after-remove:present");
        inv.done();
    });
});
</script><body></body>
