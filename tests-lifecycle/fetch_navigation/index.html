<!doctype html><meta charset="utf-8"><title>fetch_navigation</title>
<script>
window.TEST_LOGS = ["index-start"];
window.TEST_RESULT = { done: false, scenario: "fetch_navigation" };
fetch("resource.txt?delay=1").then(r => r.text()).then(() => {
  window.TEST_LOGS.push("stale-fetch-then");
  document.body.textContent = "stale fetch mutation";
}).catch(() => {
  window.TEST_LOGS.push("fetch-rejected-before-navigation-complete");
});
window.TEST_LOGS.push("fetch-scheduled");
window.TEST_LOGS.push("navigation-started");
location.href = "next.html";
</script>
