<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>about:blank iframe realm readiness</title>
<script>
window.TEST_LOGS = [];
window.TEST_RESULT = { done: false };

function log(value) {
    window.TEST_LOGS.push(value);
}

function checkRealm(label, win) {
    if (!win) {
        log(label + ":window-null");
        return false;
    }

    const doc = win.document;
    const objectReady = typeof win.Object === "function";
    const functionReady = typeof win.Function === "function";
    const objectProtoReady = !!(win.Object && win.Object.prototype);
    const functionProtoReady = !!(win.Function && win.Function.prototype);
    const functionToStringReady = typeof win.Function.prototype.toString === "function";
    const objectToStringReady = typeof win.Object.prototype.toString === "function";
    const navigatorReady = !!win.navigator;
    const documentReady = !!doc;
    const documentElementReady = !!(doc && doc.documentElement);

    if (objectReady) log(label + ":Object");
    if (functionReady) log(label + ":Function");
    if (objectProtoReady) log(label + ":Object.prototype");
    if (functionProtoReady) log(label + ":Function.prototype");
    if (functionToStringReady) log(label + ":Function.prototype.toString");
    if (objectToStringReady) log(label + ":Object.prototype.toString");
    if (navigatorReady) log(label + ":navigator");
    if (documentReady) log(label + ":document");
    if (documentElementReady) log(label + ":documentElement");

    try {
        const fnText = win.Function.prototype.toString.call(win.Function);
        if (typeof fnText === "string" && fnText.length > 0) log(label + ":toString-call-ok");
    } catch (err) {
        log(label + ":toString-call-error:" + err.name);
    }

    try {
        const objText = win.Object.prototype.toString.call(win.navigator);
        if (objText === "[object Navigator]" || objText === "[object Object]") log(label + ":object-toString-call-ok");
    } catch (err) {
        log(label + ":object-toString-call-error:" + err.name);
    }

    return objectReady && functionReady && objectProtoReady && functionProtoReady &&
        functionToStringReady && objectToStringReady && navigatorReady &&
        documentReady && documentElementReady;
}

window.addEventListener("DOMContentLoaded", () => {
    const iframe = document.createElement("iframe");
    iframe.src = "about:blank";
    document.body.appendChild(iframe);

    const immediateReady = checkRealm("immediate", iframe.contentWindow);

    Promise.resolve().then(() => {
        const microtaskReady = checkRealm("microtask", iframe.contentWindow);
        iframe.remove();
        log(iframe.contentWindow === null ? "detached:window-null" : "detached:window-present");
        window.TEST_RESULT = {
            done: true,
            immediateReady,
            microtaskReady,
            logs: window.TEST_LOGS.slice(),
        };
    });
});
</script>
</head>
<body></body>
</html>
