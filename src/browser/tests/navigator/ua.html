<!doctype html><meta charset="utf-8"><body>pending</body>
<script>
window.testing = { assertOk: () => {
  const n = navigator;
  if (typeof n.userAgent !== 'string' || !n.userAgent) return false;
  if (typeof n.language !== 'string' || !Array.isArray(n.languages)) return false;
  if (typeof n.hardwareConcurrency !== 'number' || n.hardwareConcurrency < 1) return false;
  // UA Client Hints is persona/version gated. The Web IDL accessor can exist
  // while the active non-Chromium/default persona has no UAData object.
  const u = n.userAgentData;
  if (u != null) {
    if (typeof u.getHighEntropyValues !== 'function') return false;
    if (!Array.isArray(u.brands) || typeof u.mobile !== 'boolean') return false;
  }
  return true;
}, printTimeoutState: () => console.log(navigator.userAgent) };
</script>
