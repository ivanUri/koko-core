<style>

  #stylo-target.stylo-cascade { color: rgb(70, 80, 90); padding: 3px; }
  .stylo-cascade { border-top-width: 2px; border-top-style: solid; }
</style>
<body>
  <main><div id="stylo-target" class="stylo-cascade">cascade</div></main>
</body>
<script>
  styloFixture.install(() => {
    const target = document.querySelector("#stylo-target");
    const observations = styloFixture.readStyle(target, ["color", "padding-top", "border-top-width", "border-top-style"]);
    return observations.status ? observations : { status: "pass", observations };

</script>
