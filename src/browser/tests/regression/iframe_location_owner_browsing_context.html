<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = {
  attempts: 0,
  assertOk() {
    if (document.body.id === "pass") return true;
    this.attempts += 1;
    if (this.attempts > 80) throw new Error(document.body.textContent);
    return false;
  },
  printTimeoutState: () => console.log(document.body.textContent),
};

const parentUrl = location.href;
const frame = document.createElement("iframe");
frame.srcdoc = "<!doctype html><title>child</title>";
document.body.appendChild(frame);
setTimeout(() => {
  try {
    frame.contentWindow.location.hash = "child-location";
    setTimeout(() => {
      const result = {
        parentUnchanged: location.href === parentUrl,
        childChanged: frame.contentWindow.location.hash === "#child-location",
        childRemainsDistinct: frame.contentWindow.location.href !== location.href,
      };
      if (Object.values(result).every(Boolean)) {
        document.body.id = "pass";
        document.body.textContent = "pass";
      } else {
        document.body.textContent = JSON.stringify(result);
      }
    }, 20);
  } catch (error) {
    document.body.textContent = `child error: ${String(error)}`;
  }
}, 0);
</script>
