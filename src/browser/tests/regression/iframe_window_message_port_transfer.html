<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = {
  assertOk: () => document.body.id === "pass",
  printTimeoutState: () => console.log(document.body.textContent),
};

const frame = document.createElement("iframe");
addEventListener("message", event => {
  if (event.data !== "ready") return;
  const channel = new MessageChannel();
  channel.port1.onmessage = portEvent => {
    if (portEvent.data === "connected") {
      document.body.id = "pass";
      document.body.textContent = "pass";
    }
  };
  frame.contentWindow.postMessage("connect", "*", [channel.port2]);
});

frame.srcdoc = `
  <script>
    addEventListener("message", event => {
      if (event.data === "connect" && event.ports.length === 1) {
        event.ports[0].postMessage("connected");
      }
    });
    parent.postMessage("ready", "*");
  <\/script>
`;
document.body.appendChild(frame);
</script>
