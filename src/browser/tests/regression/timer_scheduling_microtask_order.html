<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = {
  assertOk: () => document.body.id === "pass",
  printTimeoutState: () => console.log(document.body.textContent),
};

let phase = "before-schedule";
let microtaskPhase = null;

Promise.resolve().then(() => {
  microtaskPhase = phase;
});

setTimeout(() => {
  if (microtaskPhase === "after-schedule") {
    document.body.id = "pass";
    document.body.textContent = "pass";
  } else {
    document.body.id = "fail";
    document.body.textContent =
      `microtask checkpointed inside setTimeout (phase=${microtaskPhase})`;
  }
});

phase = "after-schedule";
</script>
