<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = { assertOk: () => document.body.id === "pass", printTimeoutState: () => console.log(document.body.textContent) };

const iframe = document.createElement("iframe");
const srcdoc = "<!doctype html><body id='srcdoc-body'>srcdoc-content</body>";
iframe.srcdoc = srcdoc;
document.body.appendChild(iframe);

const result = {
  reflectedSrcdoc: iframe.srcdoc === srcdoc,
  childBodyExists: !!iframe.contentDocument?.body,
  childBodyId: iframe.contentDocument?.body?.id === "srcdoc-body",
  childBodyText: iframe.contentDocument?.body?.textContent === "srcdoc-content",
};
if (Object.values(result).every(Boolean)) {
  document.body.id = "pass";
  document.body.textContent = "pass";
} else {
  document.body.textContent = JSON.stringify(result);
}
</script>
