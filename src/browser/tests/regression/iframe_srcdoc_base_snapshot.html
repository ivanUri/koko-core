<!doctype html>
<meta charset="utf-8">
<base href="/creator-first/">
<body>pending</body>
<script>
window.testing = {
  attempts: 0,
  assertOk() {
    if (document.body.id === "pass") return true;
    this.attempts += 1;
    if (this.attempts > 80) throw new Error(document.body.textContent);
    return false;
  },
  printTimeoutState: () => console.log(document.body.textContent),
};

const frame = document.createElement("iframe");
frame.srcdoc = "<!doctype html><a id='before' href='asset.js'>asset</a>";
document.body.appendChild(frame);

setTimeout(() => {
  try {
    const childDocument = frame.contentDocument;
    const before = childDocument.getElementById("before").href;
    document.querySelector("base").href = "/creator-second/";
    const afterLink = childDocument.createElement("a");
    afterLink.href = "later.js";

    const result = {
      initialUsesCreatorBase: before.endsWith("/creator-first/asset.js"),
      laterResolutionUsesSnapshot: afterLink.href.endsWith("/creator-first/later.js"),
      parentBaseActuallyChanged: document.baseURI.endsWith("/creator-second/"),
      childDocumentUrlPreserved: childDocument.URL === "about:srcdoc",
    };
    if (Object.values(result).every(Boolean)) {
      document.body.id = "pass";
      document.body.textContent = "pass";
    } else {
      document.body.textContent = JSON.stringify(result);
    }
  } catch (error) {
    document.body.textContent = String(error?.stack || error);
  }
}, 0);
</script>
