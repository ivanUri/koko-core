<!doctype html>
<meta charset="utf-8">
<body id="parent-body">parent</body>
<script>
window.testing = { assertOk: () => document.body.dataset.testState === "pass", printTimeoutState: () => console.log(document.body.textContent) };

const iframe = document.createElement("iframe");
iframe.srcdoc = "<!doctype html><body><div id='child-only'>child</div></body>";
document.body.appendChild(iframe);

const childOnly = iframe.contentDocument.querySelector("#child-only");
const result = {
  childElementExists: childOnly !== null,
  parentCannotQueryChild: document.querySelector("#child-only") === null,
  parentBodyUnchanged: document.body.id === "parent-body",
  childBodyIsSeparate: iframe.contentDocument.body !== document.body,
};
if (Object.values(result).every(Boolean)) {
  document.body.dataset.testState = "pass";
  document.body.textContent = "pass";
} else {
  document.body.textContent = JSON.stringify(result);
}
</script>
