<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = {
  assertOk: () => document.body.id === "pass",
  printTimeoutState: () => console.log(document.body.textContent),
};

localStorage.removeItem("velora-stale-child-callback");
const frame = document.createElement("iframe");
frame.srcdoc = `<!doctype html><script>
  setTimeout(() => localStorage.setItem(
    "velora-stale-child-callback", "fired"), 30);
<\/script>`;
document.body.appendChild(frame);

// Replace the child realm while its timer remains queued. Parent stays alive
// as a stable observer of the old generation.
frame.contentWindow.location.href =
  "navigation_drops_stale_realm_callbacks_target.html";

setTimeout(() => {
  const staleFired = localStorage.getItem("velora-stale-child-callback") === "fired";
  localStorage.removeItem("velora-stale-child-callback");
  const childLoaded = frame.contentDocument?.body?.id === "target";
  document.body.id = !staleFired && childLoaded ? "pass" : "fail";
  document.body.textContent = JSON.stringify({staleFired, childLoaded});
}, 100);
</script>
