<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = {
  assertOk: () => document.body.id === "pass",
  printTimeoutState: () => console.log(document.body.textContent),
};

let phase = "before-append";
let observedPhase = null;

Promise.resolve().then(() => {
  observedPhase = phase;
  if (observedPhase === "after-append") {
    document.body.id = "pass";
    document.body.textContent = "pass";
  } else {
    document.body.id = "fail";
    document.body.textContent =
      `microtask ran during appendChild (phase=${observedPhase})`;
  }
});

document.documentElement.appendChild(document.createElement("div"));
phase = "after-append";
</script>
