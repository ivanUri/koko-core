<!doctype html>
<script src="/test.js"></script>
<script>
  async_test((t) => {
    const url = URL.createObjectURL(
      new Blob(["postMessage('loaded')"], { type: "text/javascript" }),
    );
    const worker = new Worker(url);
    URL.revokeObjectURL(url);

    worker.onerror = t.unreached_func("revoked Blob worker must still load");
    worker.onmessage = t.step_func_done((event) => {
      assert_equals(event.data, "loaded");
      worker.terminate();
    });
  }, "revoking a Blob URL after Worker construction does not cancel loading");
</script>
