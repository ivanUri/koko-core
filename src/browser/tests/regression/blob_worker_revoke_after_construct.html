<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
  window.testing = {
    assertOk: () => document.body.id === "pass",
    printTimeoutState: () => console.log(document.body.textContent),
  };

  const url = URL.createObjectURL(
    new Blob(["postMessage('loaded')"], { type: "text/javascript" }),
  );
  const worker = new Worker(url);
  URL.revokeObjectURL(url);

  worker.onerror = (event) => {
    document.body.textContent = `worker error: ${event.message || "unknown"}`;
  };
  worker.onmessage = (event) => {
    if (event.data !== "loaded") {
      document.body.textContent = `unexpected message: ${String(event.data)}`;
      worker.terminate();
      return;
    }
    worker.terminate();
    document.body.id = "pass";
    document.body.textContent = "pass";
  };
</script>
