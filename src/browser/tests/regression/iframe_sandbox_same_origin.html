<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = { assertOk: () => document.body.id === "pass", printTimeoutState: () => console.log(document.body.textContent) };

const iframe = document.createElement("iframe");
iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
iframe.srcdoc = "<!doctype html><body id='same-origin-body'>same-origin</body>";
document.body.appendChild(iframe);

const childDocument = iframe.contentDocument;
const result = {
  contentDocumentAccessible: childDocument !== null,
  childBodyId: childDocument?.body?.id === "same-origin-body",
  childTextAccessible: childDocument?.body?.textContent === "same-origin",
};
if (Object.values(result).every(Boolean)) {
  document.body.id = "pass";
  document.body.textContent = "pass";
} else {
  document.body.textContent = JSON.stringify(result);
}
</script>
