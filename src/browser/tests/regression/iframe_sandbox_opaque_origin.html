<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = { assertOk: () => document.body.id === "pass", printTimeoutState: () => console.log(document.body.textContent) };

const iframe = document.createElement("iframe");
iframe.setAttribute("sandbox", "allow-scripts");
iframe.srcdoc = "<!doctype html><body>sandboxed</body>";
document.body.appendChild(iframe);

const result = {
  contentWindowExists: iframe.contentWindow !== null,
  contentDocumentBlocked: iframe.contentDocument === null,
  sandboxAttributeReflected: iframe.getAttribute("sandbox") === "allow-scripts",
};
if (Object.values(result).every(Boolean)) {
  document.body.id = "pass";
  document.body.textContent = "pass";
} else {
  document.body.textContent = JSON.stringify(result);
}
</script>
