<!doctype html>
<meta charset="utf-8">
<base id="first" href="/first/">
<base id="second" href="/second/">
<body>pending</body>
<script>
window.testing = {
  attempts: 0,
  assertOk() {
    if (document.body.id === "pass") return true;
    if (++this.attempts > 80) throw new Error(document.body.textContent);
    return false;
  },
  printTimeoutState: () => console.log(document.body.textContent),
};

try {
  const first = document.querySelector("#first");
  const second = document.querySelector("#second");
  const resolve = value => {
    const anchor = document.createElement("a");
    anchor.href = value;
    return anchor.href;
  };
  const initial = resolve("asset.js");
  second.href = "/ignored/";
  const secondIgnored = resolve("asset.js");
  first.setAttribute("href", "/updated/");
  const attributeMutation = resolve("asset.js");
  first.remove();
  const removalFallback = resolve("asset.js");

  const result = {
    firstBaseWins: initial.endsWith("/first/asset.js"),
    laterBaseIgnored: secondIgnored.endsWith("/first/asset.js"),
    attributeMutationInvalidates: attributeMutation.endsWith("/updated/asset.js"),
    removalSelectsNextBase: removalFallback.endsWith("/ignored/asset.js"),
  };
  document.body.textContent = JSON.stringify(result);
  if (Object.values(result).every(Boolean)) document.body.id = "pass";
} catch (error) {
  document.body.textContent = String(error?.stack || error);
}
</script>
