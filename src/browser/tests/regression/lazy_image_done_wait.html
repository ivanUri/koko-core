<!doctype html>
<meta charset="utf-8">
<body>
  <img id="lazy" loading="lazy" src="/lazy-image.png" width="1" height="1">
</body>
<script>
const image = document.querySelector("#lazy");
const initialComplete = image.complete;
if (initialComplete) throw new Error("lazy image was complete before deferred activation");

window.testing = {
  assertOk: () => image.complete && image.naturalWidth === 1 && image.naturalHeight === 1,
  printTimeoutState: () => console.log(`initialComplete=${initialComplete}, complete=${image.complete}, naturalWidth=${image.naturalWidth}`),
};
</script>
