<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = {
  assertOk: () => document.body.id === "pass",
  printTimeoutState: () => console.log(document.body.textContent),
};

const script = document.createElement("script");
let phase = "before-insert";

script.src =
  "/src/browser/tests/regression/script_load_event_async.js";
script.onload = () => {
  const queued =
    phase === "after-insert" && window.__externalScriptBodyRan === true;
  document.body.id = queued ? "pass" : "fail";
  document.body.textContent = queued
    ? "pass"
    : `script load dispatched synchronously (phase=${phase})`;
};
script.onerror = () => {
  document.body.id = "fail";
  document.body.textContent = "data URL script unexpectedly failed";
};

document.head.appendChild(script);
phase = "after-insert";
</script>
