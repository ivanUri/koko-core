<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = { assertOk: () => document.body.id === "pass", printTimeoutState: () => console.log(document.body.textContent) };

const ids = ["first", "second", "third"];
for (const id of ids) {
  const iframe = document.createElement("iframe");
  iframe.srcdoc = `<!doctype html><body id="${id}">${id}</body>`;
  document.body.appendChild(iframe);
}

const frames = [...document.querySelectorAll("iframe")];
const result = {
  frameCount: frames.length === ids.length,
  childOrder: frames.map((frame) => frame.contentDocument?.body?.id).join(",") === ids.join(","),
  windowsDistinct: new Set(frames.map((frame) => frame.contentWindow)).size === ids.length,
};
if (Object.values(result).every(Boolean)) {
  document.body.id = "pass";
  document.body.textContent = "pass";
} else {
  document.body.textContent = JSON.stringify(result);
}
</script>
