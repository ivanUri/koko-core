<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
  let failure = null;
  window.testing = {
    assertOk: () => {
      if (failure) throw failure;
      return document.body.id === "pass";
    },
    printTimeoutState: () => console.log(document.body.textContent),
  };

  try {
    const timing = performance.timing;
    const json = timing.toJSON();
    if (typeof timing.toJSON !== "function") {
      throw new Error("PerformanceTiming.toJSON missing");
    }
    if (
      json.navigationStart !== timing.navigationStart ||
      json.loadEventEnd !== timing.loadEventEnd
    ) {
      throw new Error(
        "PerformanceTiming.toJSON differs from public attributes",
      );
    }
    const entry = performance.getEntriesByType("navigation")[0];
    if (
      entry &&
      (typeof entry.toJSON !== "function" ||
        entry.toJSON().entryType !== "navigation")
    ) {
      throw new Error("PerformanceEntry.toJSON missing or invalid");
    }
    document.body.id = "pass";
    document.body.textContent = "pass";
  } catch (error) {
    failure = error;
    document.body.textContent = String(error);
  }
</script>
