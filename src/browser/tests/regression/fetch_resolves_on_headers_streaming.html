<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = {
  assertOk: () => {
    if (document.body.id === "fail") throw new Error(document.body.textContent);
    return document.body.id === "pass";
  },
  printTimeoutState: () => console.log(document.body.textContent),
};

(async () => {
  try {
    document.body.textContent = "awaiting headers";
    const response = await Promise.race([
      fetch("/fetch-stream-hold"),
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error("fetch waited for body completion")), 800)
      ),
    ]);

    document.body.textContent = "reading held body";
    const body = await response.text();
    if (body !== "first-second") {
      throw new Error(`streaming body was not delivered in order: ${body}`);
    }
    document.body.id = "pass";
    document.body.textContent = "pass";
  } catch (error) {
    document.body.id = "fail";
    document.body.textContent = String(error && error.stack || error);
  }
})();
</script>
