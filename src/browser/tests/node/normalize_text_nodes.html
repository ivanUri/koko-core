<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
window.testing = {
  attempts: 0,
  assertOk() {
    if (document.body.id === "pass") return true;
    if (++this.attempts > 80) throw new Error(document.body.textContent);
    return false;
  },
  printTimeoutState: () => console.log(document.body.textContent),
};

try {
  const root = document.createElement("div");
  const nested = document.createElement("span");
  const separator = document.createElement("br");
  root.append(
    document.createTextNode("a"),
    document.createTextNode(""),
    document.createTextNode("b"),
    separator,
    document.createTextNode("c")
  );
  nested.append(
    document.createTextNode("d"),
    document.createTextNode(""),
    document.createTextNode("e")
  );
  root.appendChild(nested);

  const firstText = root.firstChild;
  root.normalize();

  const result = {
    adjacentTextMergedInPlace:
      root.firstChild === firstText &&
      firstText.data === "ab" &&
      firstText.nextSibling === separator,
    elementsSeparateTextRuns:
      separator.nextSibling.data === "c" &&
      separator.nextSibling.nextSibling === nested,
    descendantsNormalized:
      nested.childNodes.length === 1 &&
      nested.firstChild.data === "de",
    noEmptyTextNodes:
      [...root.childNodes, ...nested.childNodes].every(
        node => node.nodeType !== Node.TEXT_NODE || node.data.length > 0
      ),
  };
  document.body.textContent = JSON.stringify(result);
  if (Object.values(result).every(Boolean)) document.body.id = "pass";
} catch (error) {
  document.body.textContent = String(error?.stack || error);
}
</script>
