<!doctype html>
<meta charset="utf-8">
<body>pending</body>
<script>
  window.testing = {
    assertOk: () => document.body.id === "worker-reentrant-pass",
    printTimeoutState: () => console.log(document.body.textContent),
  };
  // A reply queues the next request from inside the current message handler.
  // The browser must deliver it in a later task, never recursively enter the
  // worker scheduler while this callback still owns its event and V8 locals.
  const source = `
    onmessage = function ({ data }) {
      if (this !== self) throw new Error("WorkerGlobalScope listener receiver was not self");
      // Allocate between deliveries so the receiver and callback must remain
      // rooted for the complete worker-realm lifetime.
      Array.from({ length: 256 }, (_, i) => ({ i, data }));
      postMessage(data);
    };
  `;
  const worker = new Worker(URL.createObjectURL(new Blob([source], { type: "text/javascript" })));
  const seen = [];
  let handlerActive = false;

  worker.onmessage = ({ data }) => {
    if (handlerActive) throw new Error("worker message delivery was reentrant");
    handlerActive = true;
    seen.push(data);
    if (data < 24) worker.postMessage(data + 1);
    handlerActive = false;

    if (data === 24) {
      const expected = Array.from({ length: 25 }, (_, i) => i).join(",");
      if (seen.join(",") !== expected) throw new Error(`message order: ${seen}`);
      worker.terminate();
      document.body.id = "worker-reentrant-pass";
      document.body.textContent = "worker-reentrant-pass";
    }
  };
  worker.postMessage(0);
</script>
