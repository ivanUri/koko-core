name: Repo Profile

# Manual only — avoids failing checks on every push.
on:
  workflow_dispatch:

permissions:
  administration: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update description and homepage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DESC="$(jq -r '.description' .github/repo-profile.json)"
          HOME="$(jq -r '.homepage' .github/repo-profile.json)"
          gh api "repos/${{ github.repository }}" -X PATCH \
            -f description="$DESC" \
            -f homepage="$HOME"

      - name: Update topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '{names: .topics}' .github/repo-profile.json | \
            gh api "repos/${{ github.repository }}/topics" -X PUT --input -