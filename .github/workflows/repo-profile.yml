name: Repo Profile

on:
  push:
    branches: [main]
    paths:
      - .github/repo-profile.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply repository profile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DESC="$(jq -r '.description' .github/repo-profile.json)"
          HOME="$(jq -r '.homepage // ""' .github/repo-profile.json)"

          gh repo edit "${{ github.repository }}" \
            --description "$DESC" \
            --homepage "$HOME"

          TOPICS="$(jq -r '.topics[]' .github/repo-profile.json | paste -sd, -)"
          IFS=',' read -ra ARR <<< "$TOPICS"
          ARGS=()
          for t in "${ARR[@]}"; do
            ARGS+=(--add-topic "$t")
          done
          gh repo edit "${{ github.repository }}" "${ARGS[@]}"