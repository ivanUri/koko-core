name: Quality

on:
  pull_request:
    paths:
      - ".github/workflows/quality.yml"
      - "build.zig"
      - "build.zig.zon"
      - "src/**"
      - "vendor/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/quality.yml"
      - "build.zig"
      - "build.zig.zon"
      - "src/**"
      - "vendor/**"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        run: zig fmt --check src build.zig build.zig.zon

  check-and-test:
    name: Check and test (macOS arm64)
    needs: format
    # V8 14 requires a macOS 15+ SDK. macos-14 images can expose only SDK 14.x.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      KOKO_DISABLE_TELEMETRY: "true"
      TEST_FAIL_FIRST: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Prepare Zig cache directories
        run: mkdir -p "$HOME/.cache/zig/tmp" .koko-cache .zig-cache
      - uses: actions/cache@v4
        with:
          path: |
            .koko-cache
            .zig-cache
            ~/.cache/zig
          key: koko-macos-15-arm64-zig-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'vendor/**') }}
          restore-keys: |
            koko-macos-15-arm64-zig-0.16.0-
      - name: Compile check
        run: zig build check
      - name: Run deterministic tests
        run: zig build test
