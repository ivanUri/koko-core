name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset_suffix: darwin-arm64
          - runner: macos-15-intel
            arch: x86_64
            asset_suffix: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build Koko
        run: zig build -Doptimize=ReleaseFast -Dversion="${{ steps.meta.outputs.version }}"

      - name: Package release asset
        run: ./scripts/package-release.sh "${{ steps.meta.outputs.version }}" "${{ matrix.arch }}"

      - name: Smoke test packaged binary
        run: |
          ./dist/koko-${{ steps.meta.outputs.version }}-darwin-${{ matrix.arch }}/bin/koko version
          ./dist/koko-${{ steps.meta.outputs.version }}-darwin-${{ matrix.arch }}/bin/koko --help >/dev/null

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: koko-${{ steps.meta.outputs.version }}-darwin-${{ matrix.arch }}
          path: dist/koko-${{ steps.meta.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          NOTES=".github/release-notes/v${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES=".github/release-notes/RELEASE.md"
          fi
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: koko-${{ steps.meta.outputs.version }}-darwin-*
          path: dist
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          sha256sum dist/*.tar.gz
          test -s "dist/koko-${{ steps.meta.outputs.version }}-darwin-arm64.tar.gz"
          test -s "dist/koko-${{ steps.meta.outputs.version }}-darwin-x86_64.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Koko ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes }}
          files: dist/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Trigger Homebrew tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: ivanUri/homebrew-tap
          event-type: koko-release
          client-payload: '{"version":"${{ steps.meta.outputs.version }}","tag":"${{ steps.meta.outputs.tag }}"}'
