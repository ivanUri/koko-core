name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=velora-${VERSION}-darwin-arm64.tar.gz" >> "$GITHUB_OUTPUT"
          NOTES=".github/release-notes/v${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES=".github/release-notes/RELEASE.md"
          fi
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Download release tarball
        run: |
          ASSET="${{ steps.meta.outputs.asset }}"
          VERSION="${{ steps.meta.outputs.version }}"
          URL="https://github.com/ivanUri/velora/releases/download/v${VERSION}/${ASSET}"
          if ! curl -fsSL -o "$ASSET" "$URL"; then
            echo "Release asset missing; using local build artifact path is not supported in CI." >&2
            exit 1
          fi

      - name: Verify tarball
        run: |
          ASSET="${{ steps.meta.outputs.asset }}"
          test -s "$ASSET"
          sha256sum "$ASSET"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Velora ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes }}
          files: ${{ steps.meta.outputs.asset }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true

  profile:
    name: Update repo profile
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      administration: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Apply repository profile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DESC="$(jq -r '.description' .github/repo-profile.json)"
          HOME="$(jq -r '.homepage' .github/repo-profile.json)"
          gh api "repos/${{ github.repository }}" -X PATCH \
            -f description="$DESC" \
            -f homepage="$HOME"
          jq -c '{names: .topics}' .github/repo-profile.json | \
            gh api "repos/${{ github.repository }}/topics" -X PUT --input -