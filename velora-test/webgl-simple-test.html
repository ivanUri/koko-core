
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebGL Test</title>
</head>
<body>
    <canvas id="canvas" width="300" height="150"></canvas>
    <script>
        const results = [];
        
        function test(name, fn) {
            try {
                fn();
                results.push({ name, status: 'PASS' });
                console.log('✓', name);
            } catch (e) {
                results.push({ name, status: 'FAIL', error: e.message });
                console.log('✗', name, '-', e.message);
            }
        }
        
        const canvas = document.getElementById('canvas');
        
        // Test 1: Get webgl context
        test('getContext("webgl") returns context', () => {
            const gl = canvas.getContext('webgl');
            if (!gl) throw new Error('Context is null');
        });
        
        // Test 2: Get experimental-webgl context
        test('getContext("experimental-webgl") returns context', () => {
            const gl = canvas.getContext('experimental-webgl');
            if (!gl) throw new Error('Context is null');
        });
        
        const gl = canvas.getContext('webgl');
        
        // Test 3: Constants exist
        test('WebGL constants are defined', () => {
            if (typeof gl.COLOR_BUFFER_BIT === 'undefined') throw new Error('COLOR_BUFFER_BIT undefined');
            if (typeof gl.VERTEX_SHADER === 'undefined') throw new Error('VERTEX_SHADER undefined');
            if (typeof gl.FRAGMENT_SHADER === 'undefined') throw new Error('FRAGMENT_SHADER undefined');
            if (typeof gl.TEXTURE_2D === 'undefined') throw new Error('TEXTURE_2D undefined');
            if (typeof gl.RGBA === 'undefined') throw new Error('RGBA undefined');
        });
        
        // Test 4: Methods exist
        test('WebGL methods are callable', () => {
            if (typeof gl.clearColor !== 'function') throw new Error('clearColor not a function');
            if (typeof gl.clear !== 'function') throw new Error('clear not a function');
            if (typeof gl.createBuffer !== 'function') throw new Error('createBuffer not a function');
            if (typeof gl.createShader !== 'function') throw new Error('createShader not a function');
        });
        
        // Test 5: clearColor sets state
        test('clearColor() works', () => {
            gl.clearColor(1.0, 0.0, 0.0, 1.0);
        });
        
        // Test 6: clear() works
        test('clear() works', () => {
            gl.clear(gl.COLOR_BUFFER_BIT);
        });
        
        // Test 7: readPixels works
        test('readPixels() returns data', () => {
            const pixels = new Uint8Array(4);
            gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            console.log('Pixel data:', Array.from(pixels));
        });
        
        // Test 8: Clear with red and read back
        test('Clear red and readPixels returns red', () => {
            gl.clearColor(1.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            const pixels = new Uint8Array(4);
            gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            console.log('Red clear pixel:', Array.from(pixels));
            if (pixels[0] !== 255) throw new Error(`Expected red=255, got ${pixels[0]}`);
            if (pixels[3] !== 255) throw new Error(`Expected alpha=255, got ${pixels[3]}`);
        });
        
        // Test 9: getParameter works
        test('getParameter() returns values', () => {
            const version = gl.getParameter(gl.VERSION);
            const vendor = gl.getParameter(gl.VENDOR);
            console.log('Version:', version);
            console.log('Vendor:', vendor);
            if (!version) throw new Error('VERSION is empty');
        });
        
        // Test 10: Extensions
        test('getSupportedExtensions() returns array', () => {
            const extensions = gl.getSupportedExtensions();
            if (!Array.isArray(extensions)) throw new Error('Not an array');
            console.log('Extensions count:', extensions.length);
        });
        
        // Summary
        const passed = results.filter(r => r.status === 'PASS').length;
        const failed = results.filter(r => r.status === 'FAIL').length;
        console.log(`\n📊 Results: ${passed} passed, ${failed} failed, ${results.length} total`);
        
        // Exit code for CLI
        if (failed > 0) {
            console.error('❌ Some tests failed');
        } else {
            console.log('✅ All tests passed!');
        }
    </script>
</body>
</html>
