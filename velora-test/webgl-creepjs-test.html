<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebGL CreepJS-style Test</title>
</head>
<body>
    <h1>WebGL CreepJS-style Test</h1>
    <canvas id="canvas" width="256" height="256"></canvas>
    <pre id="output"></pre>
    
    <script>
        // This mimics what CreepJS checks for WebGL
        const output = document.getElementById('output');
        const log = (msg) => {
            console.log(msg);
            output.textContent += msg + '\n';
        };
        
        try {
            const canvas = document.getElementById('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            
            if (!gl) {
                log('❌ WebGL context is NULL');
                log('BLOCKED: context');
            } else {
                log('✅ WebGL context created');
                
                // Test 1: getParameter (params)
                log('\n=== Parameters Test ===');
                const params = [
                    ['VENDOR', gl.VENDOR],
                    ['RENDERER', gl.RENDERER],
                    ['VERSION', gl.VERSION],
                    ['SHADING_LANGUAGE_VERSION', gl.SHADING_LANGUAGE_VERSION],
                    ['MAX_TEXTURE_SIZE', gl.MAX_TEXTURE_SIZE],
                    ['MAX_VERTEX_ATTRIBS', gl.MAX_VERTEX_ATTRIBS]
                ];
                
                let paramCount = 0;
                params.forEach(([name, constant]) => {
                    try {
                        const value = gl.getParameter(constant);
                        if (value !== null && value !== undefined) {
                            log(`✅ ${name}: ${value}`);
                            paramCount++;
                        } else {
                            log(`❌ ${name}: null/undefined`);
                        }
                    } catch(e) {
                        log(`❌ ${name}: ERROR - ${e.message}`);
                    }
                });
                
                if (paramCount === 0) {
                    log('BLOCKED: params (0)');
                } else {
                    log(`OK: params (${paramCount})`);
                }
                
                // Test 2: getSupportedExtensions (exts)
                log('\n=== Extensions Test ===');
                try {
                    const exts = gl.getSupportedExtensions();
                    if (exts && exts.length > 0) {
                        log(`✅ Extensions: ${exts.length} found`);
                        log(`Extensions: ${exts.join(', ')}`);
                    } else {
                        log('❌ Extensions: null or empty');
                        log('BLOCKED: exts (0)');
                    }
                } catch(e) {
                    log(`❌ Extensions ERROR: ${e.message}`);
                    log('BLOCKED: exts (0)');
                }
                
                // Test 3: Rendering and readPixels (pixels)
                log('\n=== Pixels Test ===');
                try {
                    // Clear to red
                    gl.clearColor(1.0, 0.0, 0.0, 1.0);
                    gl.clear(gl.COLOR_BUFFER_BIT);
                    
                    // Read back
                    const pixels = new Uint8Array(4);
                    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
                    
                    log(`Pixels read: [${pixels[0]}, ${pixels[1]}, ${pixels[2]}, ${pixels[3]}]`);
                    
                    // Check if it's actually red (or at least not all zeros)
                    if (pixels[0] === 0 && pixels[1] === 0 && pixels[2] === 0 && pixels[3] === 0) {
                        log('❌ Pixels are all zero');
                        log('BLOCKED: pixels');
                    } else {
                        log('✅ Pixels have data');
                    }
                } catch(e) {
                    log(`❌ Pixels ERROR: ${e.message}`);
                    log('BLOCKED: pixels');
                }
                
                // Test 4: Canvas image rendering (images)
                log('\n=== Canvas Image Test ===');
                try {
                    // Draw a triangle
                    const vertexShaderSource = `
                        attribute vec2 position;
                        void main() {
                            gl_Position = vec4(position, 0.0, 1.0);
                        }
                    `;
                    
                    const fragmentShaderSource = `
                        precision mediump float;
                        void main() {
                            gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0);
                        }
                    `;
                    
                    // Try to create shaders
                    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
                    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
                    
                    if (!vertexShader || !fragmentShader) {
                        log('❌ Could not create shaders');
                        log('BLOCKED: images');
                    } else {
                        gl.shaderSource(vertexShader, vertexShaderSource);
                        gl.shaderSource(fragmentShader, fragmentShaderSource);
                        gl.compileShader(vertexShader);
                        gl.compileShader(fragmentShader);
                        
                        const program = gl.createProgram();
                        if (!program) {
                            log('❌ Could not create program');
                            log('BLOCKED: images');
                        } else {
                            gl.attachShader(program, vertexShader);
                            gl.attachShader(program, fragmentShader);
                            gl.linkProgram(program);
                            
                            const success = gl.getProgramParameter(program, gl.LINK_STATUS);
                            if (success) {
                                log('✅ Shaders compiled and linked');
                                
                                // Try to get canvas data URL
                                try {
                                    const dataUrl = canvas.toDataURL();
                                    if (dataUrl && dataUrl.length > 100) {
                                        log(`✅ toDataURL works (${dataUrl.length} chars)`);
                                    } else {
                                        log('❌ toDataURL returned empty/short');
                                        log('BLOCKED: images');
                                    }
                                } catch(e) {
                                    log(`❌ toDataURL ERROR: ${e.message}`);
                                    log('BLOCKED: images');
                                }
                            } else {
                                const info = gl.getProgramInfoLog(program);
                                log(`❌ Shader link failed: ${info}`);
                                log('BLOCKED: images');
                            }
                        }
                    }
                } catch(e) {
                    log(`❌ Rendering ERROR: ${e.message}`);
                    log('BLOCKED: images');
                }
            }
            
        } catch (e) {
            log('\nFATAL ERROR: ' + e.message);
            log('Stack: ' + e.stack);
        }
        
        log('\n=== Test Complete ===');
    </script>
</body>
</html>
