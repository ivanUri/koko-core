<!DOCTYPE html>
<html>
<head>
    <title>WebGL getParameter Test</title>
</head>
<body>
    <h1>WebGL getParameter Test</h1>
    <canvas id="canvas" width="300" height="300"></canvas>
    <pre id="output"></pre>
    
    <script>
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl');
        const output = document.getElementById('output');
        
        if (!gl) {
            output.textContent = 'WebGL not available';
        } else {
            const results = [];
            
            // Test string parameters
            results.push(`VERSION: ${gl.getParameter(gl.VERSION)}`);
            results.push(`VENDOR: ${gl.getParameter(gl.VENDOR)}`);
            results.push(`RENDERER: ${gl.getParameter(gl.RENDERER)}`);
            results.push(`SHADING_LANGUAGE_VERSION: ${gl.getParameter(gl.SHADING_LANGUAGE_VERSION)}`);
            
            // Test numeric parameters
            results.push(`MAX_TEXTURE_SIZE: ${gl.getParameter(gl.MAX_TEXTURE_SIZE)}`);
            results.push(`MAX_VERTEX_ATTRIBS: ${gl.getParameter(gl.MAX_VERTEX_ATTRIBS)}`);
            results.push(`MAX_COMBINED_TEXTURE_IMAGE_UNITS: ${gl.getParameter(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS)}`);
            
            // Test boolean parameters
            results.push(`DEPTH_TEST: ${gl.getParameter(gl.DEPTH_TEST)}`);
            results.push(`BLEND: ${gl.getParameter(gl.BLEND)}`);
            results.push(`DITHER: ${gl.getParameter(gl.DITHER)}`);
            
            // Test extension
            const ext = gl.getExtension('WEBGL_debug_renderer_info');
            if (ext) {
                results.push(`UNMASKED_VENDOR_WEBGL: ${gl.getParameter(ext.UNMASKED_VENDOR_WEBGL)}`);
                results.push(`UNMASKED_RENDERER_WEBGL: ${gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)}`);
            }
            
            output.textContent = results.join('\n');
            console.log('WebGL getParameter test completed successfully!');
            console.log(results.join('\n'));
        }
    </script>
</body>
</html>
