<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Velora bench — dom-heavy</title>
</head>
<body>
  <h1>DOM-heavy fixture</h1>
  <div id="root"></div>
  <script>
    const root = document.getElementById("root");
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 8000; i += 1) {
      const el = document.createElement("div");
      el.setAttribute("data-bench", String(i));
      el.textContent = "node-" + i;
      frag.appendChild(el);
    }
    root.appendChild(frag);
  </script>
</body>
</html>
