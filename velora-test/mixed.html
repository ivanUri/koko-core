<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Velora bench — mixed</title>
</head>
<body>
  <h1>Mixed fixture</h1>
  <ul id="list"></ul>
  <output id="sum"></output>
  <script>
    const list = document.getElementById("list");
    let total = 0;
    for (let i = 0; i < 1200; i += 1) {
      const li = document.createElement("li");
      li.id = "item-" + i;
      li.textContent = "item " + i;
      list.appendChild(li);
      total += i;
    }
    document.getElementById("sum").textContent = String(total);
  </script>
</body>
</html>
