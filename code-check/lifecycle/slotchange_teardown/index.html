<!doctype html><meta charset="utf-8"><title>slotchange_teardown</title><body></body>
<script>
window.TEST_LOGS = ["index-start"];
window.TEST_RESULT = { done: false, scenario: "slotchange_teardown" };
customElements.define("slot-host", class extends HTMLElement {
  constructor() {
    super();
    const root = this.attachShadow({ mode: "open" });
    const slot = document.createElement("slot");
    slot.addEventListener("slotchange", () => {
      window.TEST_LOGS.push("stale-slotchange-fired");
    });
    root.appendChild(slot);
  }
});
const host = document.createElement("slot-host");
document.body.appendChild(host);
host.appendChild(document.createElement("span"));
window.TEST_LOGS.push("slotchange-queued");
window.TEST_LOGS.push("navigation-started");
sessionStorage.setItem("__lifecycle_logs__", JSON.stringify(window.TEST_LOGS));
location.href = "next.html";
</script>
