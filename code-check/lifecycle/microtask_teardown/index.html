<!doctype html><meta charset="utf-8"><title>microtask_teardown</title>
<script>
window.TEST_LOGS = ["index-start"];
window.TEST_RESULT = { done: false, scenario: "microtask_teardown" };
let count = 0;
function spin() {
  count += 1;
  if (count === 1) window.TEST_LOGS.push("microtask-loop-started");
  if (count > 1000) window.TEST_LOGS.push("stale-microtask-runaway");
  Promise.resolve().then(spin);
}
Promise.resolve().then(spin);
window.TEST_LOGS.push("navigation-started");
location.href = "next.html";
</script>
