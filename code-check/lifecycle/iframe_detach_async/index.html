<!doctype html>
<meta charset="utf-8">
<title>iframe_detach_async</title>

<body></body>
<script>
  window.TEST_LOGS = ["parent-start"];
  window.TEST_RESULT = { done: false, scenario: "iframe_detach_async" };
  window.addEventListener("message", event => {
    window.TEST_LOGS.push(event.data);
  });
  const iframe = document.createElement("iframe");
  iframe.src = "child.html";
  iframe.onload = () => {
    window.TEST_LOGS.push("iframe-loaded");
    iframe.remove();
    window.TEST_LOGS.push("iframe-removed");
    setTimeout(() => {
      window.TEST_LOGS.push("parent-stable");
      window.TEST_RESULT.done = true;
    }, 50);
  };
  document.body.appendChild(iframe);
</script>
