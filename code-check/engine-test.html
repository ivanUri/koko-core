<!DOCTYPE html>
<html>

<body>
  <pre id="out"></pre>
  <script>
    function getEngine() { const x = [].constructor; try { (-1).toFixed(-1); } catch (err) { return err.message.length + (x + '').split(x.name).join('').length; } }
    const id = getEngine();
    const IS_BLINK = id == 80;
    document.getElementById('out').textContent = JSON.stringify({
      id, IS_BLINK,
      msg: (() => { try { (-1).toFixed(-1) } catch (e) { return e.message } })(),
      accent: CSS.supports('accent-color', 'initial'),
      chrome: 'chrome' in window,
      flat: 'flat' in Array.prototype,
    });
  </script>
</body>

</html>
