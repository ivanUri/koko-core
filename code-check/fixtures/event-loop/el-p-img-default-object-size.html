<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<!-- Unsized replaced elements must use CSS default object size 300×150,
     not the internal 5px layout sentinel. -->
<img id="bare" alt="bare">
<iframe id="frame" src="about:blank"></iframe>
<script>
  const bare = document.querySelector('#bare').getBoundingClientRect();
  const frame = document.querySelector('#frame').getBoundingClientRect();
  const imgOk = bare.width === 300 && bare.height === 150;
  const iframeOk = frame.width === 300 && frame.height === 150;
  window.__el = {
    id: 'EL-P',
    ok: imgOk && iframeOk,
    img: { width: bare.width, height: bare.height },
    iframe: { width: frame.width, height: frame.height },
  };
  window.__elDone = true;
  document.title = JSON.stringify(window.__el);
</script>
