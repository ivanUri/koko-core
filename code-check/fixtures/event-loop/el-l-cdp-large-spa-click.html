<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<button id="next" style="width:160px;height:48px"><span>Next</span></button>
<div id="tree"></div>
<iframe src="about:blank" style="width:1px;height:1px"></iframe>
<script>
  window.__events = [];
  for (const type of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) {
    document.addEventListener(type, event => {
      window.__events.push(`${type}:${event.target.tagName}`);
      if (type === 'click') {
        window.__elDone = true;
        window.__el = { ok: true, responsive: true };
        document.title = JSON.stringify(window.__el);
      }
    }, true);
  }
  const tree = document.querySelector('#tree');
  for (let i = 0; i < 1500; i++) {
    const row = document.createElement('div');
    row.textContent = `row-${i}`;
    tree.append(row);
  }
  document.querySelector('#next').addEventListener('click', () => {
    window.__elDone = true;
    window.__el = { ok: true };
    document.title = JSON.stringify(window.__el);
  });
  window.__elReady = true;
</script>
