<!doctype html>
<meta charset="utf-8">
<title>media event target pending</title>
<script>
  const mediaSource = new MediaSource();
  const sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
  const checks = {
    mediaInstance: mediaSource instanceof EventTarget,
    bufferInstance: sourceBuffer instanceof EventTarget,
    mediaListener: typeof mediaSource.addEventListener === "function",
    bufferListener: typeof sourceBuffer.addEventListener === "function",
  };
  window.__el = {
    id: "EL-S",
    ok: Object.values(checks).every(Boolean),
    checks,
  };
  window.__elDone = true;
  document.title = JSON.stringify(window.__el);
</script>
