<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<script>
  window.__downAt = null;
  window.__upAt = null;
  window.__downObservedBeforeRelease = false;
  document.addEventListener('pointerdown', () => { window.__downAt = performance.now(); }, true);
  document.addEventListener('pointerup', () => {
    window.__upAt = performance.now();
    const heldMs = window.__downAt == null ? 0 : window.__upAt - window.__downAt;
    window.__el = {
      id: 'EL-N',
      ok: window.__downObservedBeforeRelease && heldMs >= 200,
      heldMs,
    };
    window.__elDone = true;
    document.title = JSON.stringify(window.__el);
  }, true);
  window.__elReady = true;
</script>
