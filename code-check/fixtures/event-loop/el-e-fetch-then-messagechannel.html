<!doctype html>
<meta charset="utf-8" />
<title>EL-E</title>
<body>
  <script>
    window.__el = { id: "EL-E", ok: false, fetchOk: false, mc: 0 };
    // Same-origin fetch + MessageChannel chain (wait_until=done shape).
    fetch("el-e-payload.txt")
      .then(function (r) {
        return r.text();
      })
      .then(function (t) {
        window.__el.fetchOk = t.trim() === "hello";
        const ch = new MessageChannel();
        ch.port1.onmessage = function () {
          window.__el.mc++;
          if (window.__el.mc < 4) ch.port2.postMessage(null);
          else finish();
        };
        ch.port2.postMessage(null);
      })
      .catch(function (e) {
        document.title = JSON.stringify({ id: "EL-E", ok: false, err: String(e) });
        window.__elDone = true;
      });
    function finish() {
      window.__el.ok = window.__el.fetchOk && window.__el.mc === 4;
      document.title = JSON.stringify({
        id: "EL-E",
        ok: window.__el.ok,
        fetchOk: window.__el.fetchOk,
        mc: window.__el.mc,
      });
      window.__elDone = true;
    }
  </script>
</body>
