<!doctype html>
<meta charset="utf-8" />
<title>EL-F</title>
<body>
  <!-- Minimal "BAILOUT → client scheduler → router ready" without Next network. -->
  <template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template>
  <div id="app">loading</div>
  <script>
    window.__el = { id: "EL-F", ok: false };
    window.__routerReady = false;
    // React-like host callback: MessageChannel schedules "hydration" then router.
    const channel = new MessageChannel();
    let phase = 0;
    channel.port1.onmessage = function () {
      phase++;
      if (phase === 1) {
        document.getElementById("app").textContent = "hydrated";
        channel.port2.postMessage(null);
      } else {
        window.__routerReady = true;
        window.next = { version: "fixture", appDir: true, router: { ready: true } };
        window.__el.ok = window.__routerReady === true && !!window.next.router;
        document.title = JSON.stringify({
          id: "EL-F",
          ok: window.__el.ok,
          routerReady: window.__routerReady,
          appText: document.getElementById("app").textContent,
        });
        window.__elDone = true;
      }
    };
    channel.port2.postMessage(null);
    setTimeout(function () {
      if (!window.__elDone) {
        document.title = JSON.stringify({
          id: "EL-F",
          ok: false,
          err: "timeout",
          phase: phase,
        });
        window.__elDone = true;
      }
    }, 2000);
  </script>
</body>
