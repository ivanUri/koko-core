<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Window Keys Probe</title></head>
<body>
<script>
(function () {
    const filter = (keys) => keys.filter((k) => !/_|\d{3,}/.test(k));
    const mainKeys = filter(Object.getOwnPropertyNames(window));
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    const iframeWin = iframe.contentWindow;
    const iframeKeys = filter(Object.getOwnPropertyNames(iframeWin));
    let nestedKeys = 0;
    try {
        const idoc = iframe.contentDocument;
        if (idoc && !idoc.body) idoc.documentElement.appendChild(idoc.createElement('body'));
        if (idoc?.body) {
            const nested = idoc.createElement('iframe');
            idoc.body.appendChild(nested);
            nestedKeys = filter(Object.getOwnPropertyNames(nested.contentWindow)).length;
        }
    } catch (e) {}
    const isNative = (w, x) => /\[native code\]/.test(w[x] + '') && 'prototype' in w[x] && w[x].prototype.constructor.name === x;
    const sample = ['Object', 'Array', 'RTCPeerConnection', 'Worker', 'Permissions'];
    const nat = {};
    for (const s of sample) nat[s] = isNative(window, s);
    window.__WINDOW_KEYS_PROBE__ = {
        main: mainKeys.length,
        iframe: iframeKeys.length,
        nested: nestedKeys,
        native: nat,
        hasObject: 'Object' in window,
        objectOwn: mainKeys.includes('Object'),
    };
    document.body.textContent = JSON.stringify(window.__WINDOW_KEYS_PROBE__);
})();
</script>
</body>
</html>
