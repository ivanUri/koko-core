<!DOCTYPE html>
<html>
<head><title>client rects probe</title></head>
<body>
<pre id="out">running...</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += s + '\n'; };
  try {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;top:8.5px;left:12px;width:50px;height:30px';
    document.body.appendChild(d);
    const r0 = d.getBoundingClientRect();
    const m0 = { rl: r0.right - r0.left, wh: r0.width, bt: r0.bottom - r0.top, hh: r0.height };
    log('math0: ' + JSON.stringify(m0) + ' ok=' + (m0.rl === m0.wh && m0.bt === m0.hh));

    const ghost = document.createElement('div');
    ghost.style.cssText = 'position:absolute;visibility:hidden;width:0;height:0;top:0;left:0';
    document.body.appendChild(ghost);
    const g = ghost.getBoundingClientRect();
    log('ghost: ' + JSON.stringify({x:g.x,y:g.y,w:g.width,h:g.height,t:g.top,l:g.left}));

    const known = document.createElement('div');
    known.style.cssText = 'position:absolute;visibility:hidden;width:100px;height:100px;transform:rotate(45deg);top:0;left:0';
    document.body.appendChild(known);
    const k = known.getBoundingClientRect();
    log('rotate: ' + JSON.stringify({w:k.width,h:k.height}));

    d.className = 'shift';
    const sheet = document.createElement('style');
    sheet.textContent = '.shift { top: 9.5px !important; left: 13px !important; }';
    document.head.appendChild(sheet);
    const r1 = d.getBoundingClientRect();
    log('shift top: ' + r0.top + ' -> ' + r1.top + ' (expect +1)');

    d.className = '';
    const r2 = d.getBoundingClientRect();
    log('unshift top: ' + r2.top + ' (expect ' + r0.top + ')');
    log('unshift ok: ' + ((r0.top - r1.top) === (r2.top - r1.top)));

    const a = document.createElement('div');
    a.style.cssText = 'width:10px;height:10px;margin-left:15rem;border:solid 2px';
    const b = document.createElement('div');
    b.style.cssText = 'width:10px;height:10px;margin-left:15rem;border:solid 2px';
    document.body.appendChild(a);
    document.body.appendChild(b);
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    log('equal: left ' + ra.left + '/' + rb.left + ' right ' + ra.right + '/' + rb.right);
  } catch (e) {
    log('ERR ' + e);
  }
  out.textContent += '\nDONE';
})();
</script>
</body>
</html>
