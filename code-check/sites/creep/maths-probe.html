<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Maths Probe</title></head>
<body>
<script src="creep.js"></script>
<script>
(function wait() {
    if (!window.Fingerprint?.maths?.data) {
        setTimeout(wait, 100);
        return;
    }
    const data = window.Fingerprint.maths.data;
    const bad = [];
    for (const [k, v] of Object.entries(data)) {
        if (v && v.chrome === false) bad.push({ key: k, result: v.result });
    }
    window.__MATHS_PROBE__ = {
        lied: window.Fingerprint.maths.lied,
        total: Object.keys(data).length,
        badCount: bad.length,
        bad: bad.slice(0, 30),
        liesTotal: window.Fingerprint.lies?.totalLies ?? null,
    };
    document.body.textContent = JSON.stringify(window.__MATHS_PROBE__, null, 2);
})();
</script>
</body>
</html>
