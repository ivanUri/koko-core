<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Parallel CreepJS Stress Probe</title>
</head>
<body>
    <pre id="log"></pre>
    <script>
        const log = (...a) => {
            const line = a.map((x) => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ');
            document.getElementById('log').textContent += line + '\n';
            console.log('[parallel-probe]', ...a);
        };

        const queueEvent = () => new Promise((r) => setTimeout(r, 0));

        async function audioPost() {
            const bufferLen = 5000;
            const AUDIO_TRAP = 1e-16;
            const ctx = new OfflineAudioContext(1, bufferLen, 44100);
            const analyser = ctx.createAnalyser();
            const osc = ctx.createOscillator();
            const comp = ctx.createDynamicsCompressor();
            osc.connect(comp); comp.connect(analyser); comp.connect(ctx.destination);
            osc.start(0);
            const buffer = await new Promise((res) => {
                ctx.startRendering();
                ctx.oncomplete = (e) => res(e.renderedBuffer);
            });
            await queueEvent();
            const bins = buffer.getChannelData(0);
            const totalUnique = new Set([...bins]).size;
            const getCopyFrom = (rand, buf, copyArr) => {
                const { length } = buf;
                const start = 300;
                buf.getChannelData(0)[start] = rand;
                buf.copyFromChannel(copyArr, 0);
                return [...new Set([...buf.getChannelData(0), ...copyArr])].filter((x) => x !== 0);
            };
            const getCopyTo = (rand, buf, copyArr) => {
                buf.copyToChannel(copyArr.map(() => rand), 0);
                const f = buf.getChannelData(0)[0];
                return [...buf.getChannelData(0)].map((x) => x !== f || !x ? Math.random() : x).filter((x) => x !== f);
            };
            const noiseFactor = [...new Set([
                ...getCopyFrom(AUDIO_TRAP, new AudioBuffer({ length: 2000, sampleRate: 44100 }), new Float32Array(2000)),
                ...getCopyTo(AUDIO_TRAP, new AudioBuffer({ length: 2000, sampleRate: 44100 }), new Float32Array(2000)),
            ])].length;
            return { totalUnique, noiseFactor };
        }

        async function canvasEmoji() {
            await queueEvent();
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = '10px Arial';
            const EMOJIS = ['😀', '👾', '🎉', '🔥', '💯'];
            for (let i = 0; i < 50; i++) {
                for (const emoji of EMOJIS) context.measureText(emoji);
            }
            return 'canvas-ok';
        }

        async function rectsHeavy() {
            await queueEvent();
            const div = document.createElement('div');
            document.body.appendChild(div);
            const emojis = Array.from({ length: 40 }, (_, i) => `<div class="e" style="font-size:200px">${['😀','👾','🎉'][i % 3]}</div>`).join('');
            div.innerHTML = `<div id="box">${emojis}</div>`;
            const elems = [...div.getElementsByClassName('e')];
            const sizes = elems.map((el) => {
                const r = el.getBoundingClientRect();
                return r.width + r.height;
            });
            document.body.removeChild(div);
            return sizes.length;
        }

        (async () => {
            log('start');
            const t0 = performance.now();
            const [a, c, r] = await Promise.all([audioPost(), canvasEmoji(), rectsHeavy()]);
            log('done', { ms: (performance.now() - t0).toFixed(1), a, c, r });
            window.__PARALLEL_PROBE__ = { a, c, r };
        })().catch((e) => log('FAIL', e.message));
    </script>
</body>
</html>
