<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CreepJS Local — Velora Debug</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            background: #0f1117;
            color: #e6edf3;
        }
        header {
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            background: #161b22;
        }
        header h1 { margin: 0 0 4px; font-size: 16px; }
        header p { margin: 0; color: #8b949e; font-size: 12px; }
        main { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 56px); }
        #fingerprint-data { padding: 12px; overflow: auto; border-right: 1px solid #30363d; }
        #debug-log {
            padding: 12px;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 11px;
            line-height: 1.45;
            background: #010409;
        }
        .log-audio { color: #7ec8e3; }
        .log-pass { color: #4cca9f; }
        .log-fail { color: #f85149; }
        .log-warn { color: #d29922; }
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            #fingerprint-data { border-right: none; border-bottom: 1px solid #30363d; }
        }
    </style>
</head>
<body>
    <header>
        <h1>CreepJS Local</h1>
        <p>Chạy creep.js trực tiếp — audio debug bật mặc định. Mở DevTools hoặc xem panel bên phải.</p>
    </header>
    <main>
        <div id="fingerprint-data">
            <div id="creep-fingerprint">FP ID: computing…</div>
            <div id="fuzzy-fingerprint"></div>
            <div id="webrtc-connection"></div>
            <div id="status-info"></div>
        </div>
        <pre id="debug-log"></pre>
    </main>

    <script>
        window.CREEP_AUDIO_DEBUG = true;

        (function hookConsole() {
            const panel = document.getElementById('debug-log');
            const append = (cls, parts) => {
                const line = document.createElement('div');
                if (cls) line.className = cls;
                line.textContent = parts.join(' ');
                panel.appendChild(line);
                panel.scrollTop = panel.scrollHeight;
            };

            const wrap = (orig, cls) => (...args) => {
                orig(...args);
                const text = args.map((a) => {
                    if (typeof a === 'string') return a;
                    try { return JSON.stringify(a); } catch { return String(a); }
                }).join(' ');
                const useCls = text.includes('[velora-audio') ? 'log-audio'
                    : text.includes('passed') ? 'log-pass'
                    : text.includes('failed') ? 'log-fail'
                    : cls || '';
                append(useCls, [new Date().toISOString().slice(11, 23), text]);
            };

            console.log = wrap(console.log.bind(console));
            console.warn = wrap(console.warn.bind(console), 'log-warn');
            console.error = wrap(console.error.bind(console), 'log-fail');

            window.addEventListener('error', (e) => {
                append('log-fail', ['UNCAUGHT', e.message, e.filename, e.lineno]);
            });
            window.addEventListener('unhandledrejection', (e) => {
                append('log-fail', ['UNHANDLED REJECTION', String(e.reason)]);
            });
        })();
    </script>
    <script src="creep.js"></script>
</body>
</html>
