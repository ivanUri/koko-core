<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Canvas2d Probe</title></head>
<body>
<pre id="status">running...</pre>
<script>
const statusEl = document.getElementById('status');
const log = (...a) => console.log('[canvas2d-probe]', ...a);
const queueEvent = (t = 0) => new Promise(r => setTimeout(r, t));

const CSS_FONT_FAMILY = `Arial, "Helvetica Neue", Helvetica, sans-serif`;
const IS_WEBKIT = false;

const paintCanvas = ({ canvas, context, strokeText = false, cssFontFamily = '', area = { width: 50, height: 50 }, rounds = 10, maxShadowBlur = 50, seed = 500, offset = 2001000001, multiplier = 15000 }) => {
    if (!context) return;
    context.clearRect(0, 0, canvas.width, canvas.height);
    canvas.width = area.width;
    canvas.height = area.height;
    const createPicassoSeed = ({ seed, offset, multiplier }) => {
        let current = Number(seed) % Number(offset);
        const getNextSeed = () => { current = (Number(multiplier) * current) % Number(offset); return current; };
        return { getNextSeed };
    };
    const picassoSeed = createPicassoSeed({ seed, offset, multiplier });
    const { getNextSeed } = picassoSeed;
    const patchSeed = (current, offset, maxBound, computeFloat) => {
        const result = (((current - 1) / offset) * (maxBound || 1)) || 0;
        return computeFloat ? result : Math.floor(result);
    };
    const addRandomCanvasGradient = (context, offset, area, colors, getNextSeed) => {
        const { width, height } = area;
        const canvasGradient = context.createRadialGradient(
            patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height),
            patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, width),
            patchSeed(getNextSeed(), offset, height), patchSeed(getNextSeed(), offset, width));
        canvasGradient.addColorStop(0, colors[patchSeed(getNextSeed(), offset, colors.length)]);
        canvasGradient.addColorStop(1, colors[patchSeed(getNextSeed(), offset, colors.length)]);
        context.fillStyle = canvasGradient;
    };
    const colors = ['#FF6633','#FFB399','#3366E6','#99FF99','#B34D4D'];
    const drawOutlineOfText = (context, offset, area, getNextSeed) => {
        const { width, height } = area;
        const fontSize = 2.99;
        context.font = `${height / fontSize}px ${cssFontFamily}`;
        context.strokeText('👾A', patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height), patchSeed(getNextSeed(), offset, width));
    };
    const createCircularArc = (context, offset, area, getNextSeed) => {
        const { width, height } = area;
        context.beginPath();
        context.arc(patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height),
            patchSeed(getNextSeed(), offset, Math.min(width, height)),
            patchSeed(getNextSeed(), offset, 2 * Math.PI, true), patchSeed(getNextSeed(), offset, 2 * Math.PI, true));
        context.stroke();
    };
    const createBezierCurve = (context, offset, area, getNextSeed) => {
        const { width, height } = area;
        context.beginPath();
        context.moveTo(patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height));
        context.bezierCurveTo(patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height),
            patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height),
            patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height));
        context.stroke();
    };
    const createQuadraticCurve = (context, offset, area, getNextSeed) => {
        const { width, height } = area;
        context.beginPath();
        context.moveTo(patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height));
        context.quadraticCurveTo(patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height),
            patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height));
        context.stroke();
    };
    const createEllipticalArc = (context, offset, area, getNextSeed) => {
        if (!('ellipse' in context)) return;
        const { width, height } = area;
        context.beginPath();
        context.ellipse(patchSeed(getNextSeed(), offset, width), patchSeed(getNextSeed(), offset, height),
            patchSeed(getNextSeed(), offset, Math.floor(width / 2)), patchSeed(getNextSeed(), offset, Math.floor(height / 2)),
            patchSeed(getNextSeed(), offset, 2 * Math.PI, true), patchSeed(getNextSeed(), offset, 2 * Math.PI, true),
            patchSeed(getNextSeed(), offset, 2 * Math.PI, true));
        context.stroke();
    };
    const methods = [createCircularArc, createBezierCurve, createQuadraticCurve];
    if (!IS_WEBKIT) methods.push(createEllipticalArc);
    if (strokeText) methods.push(drawOutlineOfText);
    [...Array(rounds)].forEach(() => {
        addRandomCanvasGradient(context, offset, area, colors, getNextSeed);
        context.shadowBlur = patchSeed(getNextSeed(), offset, maxShadowBlur, true);
        context.shadowColor = colors[patchSeed(getNextSeed(), offset, colors.length)];
        methods[patchSeed(getNextSeed(), offset, methods.length)](context, offset, area, getNextSeed);
        context.fill();
    });
};

(async () => {
    await queueEvent(0);
    log('after queueEvent 1');
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    const canvasCPU = document.createElement('canvas');
    const contextCPU = canvasCPU.getContext('2d', { desynchronized: true, willReadFrequently: true });
    log('contexts', { main: !!context, cpu: !!contextCPU });
    await queueEvent(0);
    log('before paintCanvas');
    paintCanvas({ canvas, context, strokeText: true, cssFontFamily: CSS_FONT_FAMILY, area: { width: 75, height: 75 }, rounds: 10 });
    log('after paintCanvas');
    const dataURI = canvas.toDataURL();
    log('after toDataURL', dataURI?.slice(0, 40));
    window.__CANVAS2D_PROBE__ = { ok: true, len: dataURI?.length };
    statusEl.textContent = 'PASS len=' + dataURI?.length;
})();
</script>
</body>
</html>
