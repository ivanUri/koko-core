<!DOCTYPE html>
<html>
<head><title>tt eval probe</title></head>
<body>
<script>
(function () {
  const id = (s) => s;
  const tt = window.trustedTypes;
  const out = { hasTT: !!tt, hasCreate: !!(tt && tt.createPolicy) };
  if (tt && tt.createPolicy) {
    try {
      const pol = tt.createPolicy("ks", { createHTML: id, createScript: id, createScriptURL: id });
      const ts = pol.createScript("1");
      out.tsType = typeof ts;
      out.tsToString = ts && ts.toString ? ts.toString() : null;
      const ev = eval(ts);
      out.evalType = typeof ev;
      out.evalValue = ev;
      out.evalIsOne = ev === 1;
      const ev2 = eval(pol.createScript("window.__knitsailTest=42"));
      out.knitsailTest = window.__knitsailTest;
      out.bigEvalOk = ev2 === 42;
    } catch (e) {
      out.error = String(e);
    }
  }
  window.__ttEvalProbe = out;
})();
</script>
</body>
</html>
